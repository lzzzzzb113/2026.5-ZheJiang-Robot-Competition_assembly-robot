# choose st-link/j-link/dap-link etc.
adapter driver cmsis-dap
transport select swd

# 速度设置：初始使用低速以确保连接，可连接后调整
# 首次连接建议使用较低速度
set INITIAL_SPEED 10000
adapter speed $INITIAL_SPEED

# 禁用所有硬件复位信号
reset_config none

# ??OpenOCD\share\openocd\scripts\target??stm.32f1x.cfg??? <br># ????????stm32???????????
source [find target/ti_mspm0.cfg]